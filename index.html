<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
            background: rgba(30, 41, 59, 0.8);
            padding: 60px 40px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #f1f5f9;
        }
        p {
            font-size: 1.1em;
            color: #cbd5e1;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .button {
            background-color: #ea580c;
            color: white;
            padding: 14px 40px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            margin-top: 20px;
        }
        .button:hover {
            background-color: #c23d07;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(234, 88, 12, 0.3);
        }
        .status {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid rgba(148, 163, 184, 0.2);
            font-size: 0.95em;
            color: #94a3b8;
        }
        .status-badge {
            display: inline-block;
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
            padding: 6px 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Product Analyzer</h1>
        <p>Find the best digital products to create and sell in West Africa</p>
        <p>Analyze product viability, get creation guidelines, and build your successful business</p>
        <button class="button">Get Started Now</button>
        <div class="status">
            <p>Platform Status</p>
            <div class="status-badge">✓ Live on GitHub Pages</div>
        </div>
    </div>
</body>
</html>
